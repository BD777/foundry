name: Release

# Pushing a version tag (v0.4.0) publishes the worker packages to npm, so
# `npx -y @foundry/worker@latest install` installs that release. The tag must
# match the packages' version. Needs the NPM_TOKEN repository secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in packages/protocol packages/worker; do
            version=$(node -p "require('./$package/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "$package is $version, tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done

      - name: Build and test the packages
        run: |
          pnpm --filter @foundry/protocol test
          pnpm --filter @foundry/worker build

      - name: Publish (protocol first; the worker depends on it)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; nothing is published." >&2
            exit 1
          fi
          for package in protocol worker; do
            pnpm --filter "./packages/$package" publish --access public --provenance --no-git-checks
          done
