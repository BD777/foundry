name: Release

# Pushing a version tag (v0.4.0) publishes the worker packages to npm, so
# `npx -y @bd777/foundry-worker@latest install` installs that release. The tag must
# match the packages' version. npm trusts this workflow (Trusted Publishing,
# OIDC) for both packages, so no npm token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use an npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in packages/protocol packages/worker; do
            version=$(node -p "require('./$package/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "$package is $version, tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done

      - name: Build and test the packages
        run: |
          pnpm --filter @bd777/foundry-protocol test
          pnpm --filter @bd777/foundry-worker build

      - name: Publish (protocol first; the worker depends on it)
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for package in protocol worker; do
            # pnpm pack turns workspace:* into the released version.
            pnpm --filter "./packages/$package" pack --pack-destination "$RUNNER_TEMP/packages"
          done
          for package in protocol worker; do
            name="@bd777/foundry-$package"
            version=$(node -p "require('./packages/$package/package.json').version")
            # A version already on npm (such as a first publish by hand) is kept.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipped."
              continue
            fi
            npm publish "$RUNNER_TEMP"/packages/bd777-foundry-$package-*.tgz --access public
          done
