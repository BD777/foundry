name: Verify

# A pull request is verified once, on its pull_request event; pushes verify
# only main. Any other branch can be verified by hand (workflow_dispatch).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running verification. On main
# every merge keeps its own result, so a red main names the commit that broke it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The three parts of `pnpm verify` run as parallel jobs; `verify` is the
# required status check and passes only when all of them pass.
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-cache: web
      - name: Typecheck, build, test and audit the web app
        run: pnpm verify:web

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-cache: packages

      # Linux worker tests and Issue execution isolate writes with bubblewrap,
      # which needs unprivileged user namespaces. Ubuntu runners restrict them
      # through AppArmor by default. The test launcher runs the suite inside
      # bwrap, and the sandboxes under test start bwrap again inside it. Ubuntu
      # 26.04 loads the bwrap-userns-restrict profile, which confines every
      # child of bwrap as unpriv_bwrap without CAP_SYS_ADMIN, so that nested
      # bwrap cannot create its namespaces. With the restriction switched off
      # that profile has nothing left to allow; unload it.
      - name: Enable bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- \
            bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-ipc \
            --proc /proc --dev /dev -- true

      - name: Check formatting
        run: pnpm format

      # The HTTP evidence test builds its fixture server inside a 90s scenario
      # budget. Compile cold Go dependencies separately so that budget measures
      # the end-to-end behavior, including after go.sum invalidates the cache.
      - name: Build Server test prerequisite
        working-directory: apps/server
        run: go build -o "$RUNNER_TEMP/foundry-evidence-server" ./cmd/foundry-server

      - name: Test the protocol and Worker packages and audit the contracts
        run: pnpm verify:packages

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-cache: go
      - name: Vet and test the Server
        run: pnpm verify:go

  verify:
    if: always()
    needs: [web, packages, go]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of verify passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "web, packages, go: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
