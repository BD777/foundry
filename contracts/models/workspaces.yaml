openapi: 3.1.0
info:
  title: Foundry workspaces
  version: 1.0.0
  description:
    "Workspaces: projections, files and folder moves. Part of the Foundry contract
    (contracts/foundry.openapi.yaml); `pnpm generate:contracts` generates its TypeScript types and
    Go models (apps/server/internal/store/workspaces_gen.go)."
x-oapi-codegen:
  output-options:
    prefer-skip-optional-pointer: true
paths: {}
components:
  schemas:
    WorkspaceAccessRole:
      type: string
      enum:
        - viewer
        - member
        - maintainer
        - owner
      x-go-type: string
    WorkspaceKind:
      description: Every workspace is a project except each person's Personal Agent Workspace.
      type: string
      enum:
        - project
        - personal_agent
      x-go-type: string
    WorkspaceProjection:
      type: object
      required:
        - id
        - name
        - localPath
        - baseline
        - contextSummary
        - acceptedCount
        - resolvedCount
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        localPath:
          type: string
        baseline:
          type: string
        contextSummary:
          type: string
        acceptedCount:
          type: integer
        resolvedCount:
          type: integer
        deviceId:
          type: string
        deviceLabel:
          type: string
        accessRole:
          description: "`accessRole` is the caller's role in the workspace, set per request."
          $ref: "#/components/schemas/WorkspaceAccessRole"
        unavailableOnDevice:
          description:
            "`unavailableOnDevice` is set while its device, connected, does not serve the folder.
            Its sessions and history stay; adding the folder on the device again clears it."
          $ref: "#/components/schemas/WorkspaceUnavailability"
          x-go-type-skip-optional-pointer: false
        kind:
          description: "`kind` is WorkspaceKindProject (sent as absent) or WorkspaceKindPersonalAgent."
          $ref: "#/components/schemas/WorkspaceKind"
        archivedAt:
          description:
            '`archivedAt` is set while the workspace is archived: hidden in an "Archived" group,
            starting no sessions, everything kept.'
          type: string
        migration:
          description:
            "`migration` is the workspace's move to another device (DEV-146) still under way, or
            the latest completed one whose old copy on the source device was not deleted yet."
          $ref: "#/components/schemas/WorkspaceMigrationSummary"
          x-go-type-skip-optional-pointer: false
    WorkspaceMigrationState:
      description:
        "preflight, copying, verifying, activating, retiring, then complete; canceled and failed
        end it too. While copying, verifying or activating the workspace is frozen: no new
        sessions or messages run there."
      type: string
      enum:
        - preflight
        - copying
        - verifying
        - activating
        - retiring
        - complete
        - canceled
        - failed
      x-go-type: string
    WorkspaceMigrationSummary:
      description:
        "WorkspaceMigrationSummary is what the workspace list shows of a move: the one under way,
        else the latest complete one whose old copy was not deleted, else the latest move when it
        failed. A canceled move is never shown."
      type: object
      required:
        - id
        - state
        - sourceDeviceId
        - sourceDeviceLabel
        - targetDeviceId
        - targetDeviceLabel
      additionalProperties: false
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/WorkspaceMigrationState"
        sourceDeviceId:
          type: string
        sourceDeviceLabel:
          type: string
        targetDeviceId:
          type: string
        targetDeviceLabel:
          type: string
        step:
          description: WorkspaceMigration.step.
          type: string
        files:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        waitingFor:
          type: string
          enum:
            - source_device
            - target_device
          x-go-type: string
    WorkspaceMigrationFolderWarning:
      description: Something in the folder that does not travel as it is (the source scan's warnings).
      type: object
      required:
        - kind
        - path
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - external_symlink
            - case_conflict
            - long_path
            - unreadable
            - special_file
          x-go-type: string
        path:
          type: string
        detail:
          type: string
    WorkspaceMigrationBlocker:
      description: Work in the workspace that must end before it can move.
      type: object
      required:
        - kind
        - id
        - title
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - session
            - issue_run
            - pa_patch
            - knowledge_vault
            - other
          x-go-type: string
        id:
          type: string
        title:
          type: string
    WorkspaceMigrationNotCarried:
      description:
        A setting of the workspace tied to the source device; it is not moved and has to be set up
        again on the target device.
      type: object
      required:
        - kind
        - id
        - label
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - profile
            - connector_binding
            - service_tunnel
            - resource_lease
            - feishu_gateway_grant
          x-go-type: string
        id:
          type: string
        label:
          type: string
    WorkspaceMigrationSourcePurge:
      description:
        "Whether the old copy on the source device was deleted. A delete that kept files changed
        after the move leaves state none and records lastAttemptAt and keptCount."
      type: object
      required:
        - state
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            - none
            - purged
          x-go-type: string
        at:
          type: string
        bytes:
          type: integer
          format: int64
        removed:
          description: How many paths were removed.
          type: integer
        lastAttemptAt:
          description: When a delete last ran that kept changed files.
          type: string
        keptCount:
          description: How many changed paths that delete kept.
          type: integer
    WorkspaceMigration:
      description:
        "WorkspaceMigration moves a workspace, same id and history, to a folder on another device
        (docs/devlog/DEV-146-workspace-migration.md)."
      type: object
      required:
        - id
        - workspaceId
        - sourceDeviceId
        - sourceDeviceLabel
        - sourcePath
        - targetDeviceId
        - targetDeviceLabel
        - targetPath
        - state
        - step
        - files
        - bytes
        - totalFiles
        - totalBytes
        - warnings
        - blockers
        - notCarried
        - reason
        - cancelRequested
        - createdAt
        - updatedAt
        - sourcePurge
      additionalProperties: false
      properties:
        id:
          type: string
        workspaceId:
          type: string
        sourceDeviceId:
          type: string
        sourceDeviceLabel:
          type: string
        sourcePath:
          type: string
        targetDeviceId:
          type: string
        targetDeviceLabel:
          type: string
        targetPath:
          type: string
        state:
          $ref: "#/components/schemas/WorkspaceMigrationState"
        step:
          description:
            "The current sub-step, a short machine word: queued, checking, scanning,
            checking_target, streaming, retrying, copying_changes, verifying_target, rescanning,
            activating_target, retiring_source, aborting, done."
          type: string
        files:
          description: Files received on the target so far.
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        totalFiles:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMigrationFolderWarning"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMigrationBlocker"
        notCarried:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMigrationNotCarried"
        reason:
          description: Why it failed or what it waits for, in English; "" when nothing to say.
          type: string
        reasonCode:
          description:
            "Machine code of reason, for the Web to localize: device_offline, worker_outdated,
            target_path_taken, target_path_unavailable, not_enough_space, workspace_busy,
            device_refused, transfer_retrying, transfer_failed, verify_mismatch, canceled_by_person.
            The migration routes answer errors as {code, error}; their codes: invalid_request,
            same_device, folder_missing, migration_active, device_offline, target_path_taken (start);
            no_migration (current); not_cancelable (cancel); not_complete, already_purged,
            device_offline, device_refused, worker_outdated (purge-source)."
          type: string
        waitingFor:
          type: string
          enum:
            - source_device
            - target_device
          x-go-type: string
        cancelRequested:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        completedAt:
          type: string
        sourcePurge:
          $ref: "#/components/schemas/WorkspaceMigrationSourcePurge"
    WorkspaceMigrationPurgePreview:
      description:
        "What deleting the old copy removes (confirm false: nothing removed yet) and which paths it
        keeps because they changed after the move."
      type: object
      required:
        - removed
        - changed
        - bytes
        - done
      additionalProperties: false
      properties:
        removed:
          type: array
          items:
            type: string
        changed:
          type: array
          items:
            type: string
        bytes:
          type: integer
          format: int64
        done:
          type: boolean
        migration:
          $ref: "#/components/schemas/WorkspaceMigration"
          x-go-type-skip-optional-pointer: false
    WorkspaceUnavailability:
      description: WorkspaceUnavailability says why a workspace cannot run on its device.
      type: object
      required:
        - reason
        - since
      additionalProperties: false
      properties:
        reason:
          description: "`reason` is WorkspaceNotServed or WorkspaceFolderMissing."
          type: string
          enum:
            - not_served
            - folder_missing
          x-go-type: string
        since:
          type: string
    WorkspaceNativeSessionsMoved:
      description:
        WorkspaceNativeSessionsMoved is what relinking did to make the workspace's native
        sessions resumable in its new folder.
      type: object
      required:
        - copied
        - alreadyThere
        - notFound
      additionalProperties: false
      properties:
        copied:
          description: Native sessions now resumable in the new folder (copied there).
          type: integer
        alreadyThere:
          description: Already resumable there (nothing to do, e.g. Codex, keyed by id).
          type: integer
        notFound:
          description:
            "Not found on the device: their chats continue in a new native session that is given
            the Foundry conversation."
          type: integer
    WorkspaceRelinkSuggestion:
      description:
        'WorkspaceRelinkSuggestion is a folder that looks like a missing workspace''s, moved:
        "same_workspace" or "same_git_remote".'
      type: object
      required:
        - path
        - reason
      additionalProperties: false
      properties:
        path:
          type: string
        reason:
          description:
            '"same_workspace": the folder holds this workspace''s own Foundry identity
            (.foundry/workspace.json), so it is the folder, moved or renamed. "same_git_remote":
            its Git repository has the same origin remote.'
          type: string
          enum:
            - same_workspace
            - same_git_remote
          x-go-type: string
    WorkspaceFileEntry:
      type: object
      required:
        - id
        - workspaceId
        - path
        - name
        - kind
        - sizeLabel
        - updatedLabel
      additionalProperties: false
      properties:
        revision:
          description: Device content identity for bounded instruction files.
          type: string
        id:
          type: string
        workspaceId:
          type: string
        path:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - file
            - directory
          x-go-type: string
        sizeLabel:
          type: string
        updatedLabel:
          type: string
    WorkspaceDirectoryEntry:
      type: object
      required:
        - id
        - name
        - path
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
    WorkspaceTreeEntry:
      type: object
      required:
        - id
        - name
        - path
        - isDirectory
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        isDirectory:
          type: boolean
        size:
          type: integer
          format: int64
        extension:
          type: string
    AssetProjection:
      type: object
      required:
        - id
        - name
        - kind
        - status
        - detail
      additionalProperties: false
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - worktree_pool
            - preview_ports
            - artifact_archive
            - provider_auth
          x-go-type: string
        status:
          type: string
          enum:
            - available
            - leased
            - missing
            - blocked
          x-go-type: string
        detail:
          type: string
