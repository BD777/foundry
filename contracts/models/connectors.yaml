openapi: 3.1.0
info:
  title: Foundry connectors
  version: 1.0.0
  description:
    "Connectors: what device extensions provide and external account material. Part of the
    Foundry contract (contracts/foundry.openapi.yaml); `pnpm generate:contracts` generates its
    TypeScript types and Go models (apps/server/internal/store/connectors_gen.go)."
x-oapi-codegen:
  output-options:
    prefer-skip-optional-pointer: true
paths: {}
components:
  schemas:
    ConnectorRequirement:
      description:
        'ConnectorRequirement is a condition a device must meet for the connector to work there
        ("tcp_reachable": host:port opens within a few seconds).'
      type: object
      required:
        - kind
        - host
        - port
        - label
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - tcp_reachable
          x-go-type: string
        host:
          type: string
        port:
          type: integer
        label:
          description: What the requirement means to a person ("Company network").
          type: string
    ConnectorTool:
      description:
        ConnectorTool is the program a connector's sessions use and where Foundry installs it
        from ("npm" through the managed-tools path, "installer" through the vendor's official
        per-user installer, which the worker's adapter runs). MinimumVersion marks older copies as
        outdated.
      type: object
      required:
        - command
      additionalProperties: false
      properties:
        command:
          type: string
        source:
          description:
            '"device": installed outside Foundry; "npm": a managed package; "installer": the
            vendor''s official per-user installer, run by the worker''s adapter at the owner''s click.'
          type: string
          enum:
            - npm
            - device
            - installer
          x-go-type: string
        package:
          type: string
        registry:
          description: Where the package comes from; "device" is the device's own npm settings.
          type: string
        minimumVersion:
          description: Older copies work worse or not at all ("2.0.0" for AWS CLI v2).
          type: string
        versionCheck:
          $ref: "#/components/schemas/ConnectorVersionCheck"
          x-go-type-skip-optional-pointer: false
    ConnectorVersionCheck:
      description:
        ConnectorVersionCheck is what checking a new version of the connector's tool runs on a
        bundle rollout's canary device, after `--version`, in the session environment the
        connector gives a session (docs/skills.md, Bundle 版本). Every command must exit 0.
      type: object
      required:
        - commands
      additionalProperties: false
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorVersionCheckCommand"
    ConnectorVersionCheckCommand:
      type: object
      required:
        - args
      additionalProperties: false
      properties:
        args:
          description: The tool's arguments; the tool itself is the connector's command.
          type: array
          items:
            type: string
        expect:
          description: Text the output must contain.
          type: string
        result:
          description: >-
            What a passed run shows people, in one line instead of its output (which can name
            the account) - "status" (signed in, token valid), "refresh" (token refreshed) or
            "read" (reached the service as the account, named by show).
          type: string
          enum: [status, refresh, read]
        show:
          description: >-
            A dotted path into the command's JSON output whose value the one-line result names
            (e.g. data.name for the account's display name). Nothing else of the output is kept.
          type: string
    ConnectorAuthorizationGroup:
      description: A shared credential requirement; multiple business capabilities can use it.
      type: object
      required:
        - id
        - revision
        - label
        - capabilities
        - credential
      additionalProperties: false
      properties:
        id:
          type: string
        revision:
          type: integer
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorAuthorizationScope"
        scopeSource:
          description: Where the scope list comes from; "All" is offered only when it is complete.
          $ref: "#/components/schemas/ConnectorScopeSource"
          x-go-type-skip-optional-pointer: false
        scopesRemovable:
          description: Unchecking a granted scope removes it (the tool can drop scopes); otherwise authorizing only adds.
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        credential:
          type: string
          enum:
            - native_login
            - native_web_session
          x-go-type: string
    ConnectorAuthorizationScope:
      type: object
      required: [id, label]
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        recommended:
          type: boolean
        required:
          description: Always requested and never removed (a tool's own minimum).
          type: boolean
        impliedBy:
          description: Broader scopes that include this one; granted when any of them is.
          type: array
          items:
            type: string
    ConnectorScopeSource:
      description: The list a set of scopes was taken from.
      type: object
      required: [label, url, complete]
      additionalProperties: false
      properties:
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        url:
          description: An https page or listing endpoint.
          type: string
        complete:
          description: The source is the vendor's authoritative list of every scope (official docs, SDK or CLI constant, or a listing API).
          type: boolean
    ConnectorScopeChange:
      type: object
      required: [source, at, added, removed]
      additionalProperties: false
      properties:
        source:
          description:
            "foundry: an authorization or sign-in Foundry ran; outside: the tool's own login
            changed without Foundry (a terminal, another app, or a session that bypassed it)."
          type: string
          enum:
            - foundry
            - outside
          x-go-type: string
        at:
          description: When the device first read the changed set.
          type: string
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
    ConnectorPermissions:
      description:
        "A connector whose permissions are not chosen at sign-in (IAM policies, an SSO
        permission set, an app's configuration): where they are managed instead."
      type: object
      required: [managedBy, description]
      additionalProperties: false
      properties:
        managedBy:
          type: string
          enum:
            - vendor_policy
          x-go-type: string
        description:
          type: string
        descriptions:
          type: object
          additionalProperties:
            type: string
        url:
          description: The vendor console page where they are managed (https).
          type: string
    ConnectorAuthorizationState:
      type: object
      required:
        - id
        - revision
        - status
        - checkedAt
        - verification
      additionalProperties: false
      properties:
        id:
          type: string
        revision:
          type: integer
        status:
          type: string
          enum:
            - ready
            - needs_auth
            - expired
            - unknown
            - unavailable
          x-go-type: string
        checkedAt:
          type: string
        verification:
          type: string
          enum:
            - local_state
            - not_checked
          x-go-type: string
        grantedScopes:
          type: array
          items:
            type: string
        lastChange:
          description: The latest change of grantedScopes the device saw, and whether Foundry made it.
          $ref: "#/components/schemas/ConnectorScopeChange"
          x-go-type-skip-optional-pointer: false
        reason:
          description: Adapter code only; never raw provider output or credentials.
          type: string
          enum:
            - bootstrap_available
            - cli_upgrade
            - check_failed
          x-go-type: string
    ConnectorField:
      description:
        ConnectorField is one field a sign-in method or a server-held instance form asks
        for, rendered by the Web.
      type: object
      required:
        - id
        - label
        - type
      additionalProperties: false
      properties:
        id:
          description: 1–32 letters, digits or underscores, starting with a letter.
          type: string
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        help:
          type: string
        helps:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
          enum:
            - text
            - secret
            - url
            - select
          x-go-type: string
        required:
          type: boolean
        placeholder:
          type: string
        default:
          type: string
        pattern:
          description: A regular expression the whole value must match (checked by the host).
          type: string
        options:
          description: "select: the choices."
          type: array
          items:
            $ref: "#/components/schemas/ConnectorOption"
        optionsFrom:
          description:
            "select: fill the choices from a server-held probe (`probe:<probe-id>`)
            instead of static options."
          type: string
        showWhen:
          description: Shown only while another field of the method holds one of these values.
          $ref: "#/components/schemas/ConnectorShowWhen"
          x-go-type-skip-optional-pointer: false
    ConnectorOption:
      description: ConnectorOption is one choice of a select field.
      type: object
      required:
        - value
        - label
      additionalProperties: false
      properties:
        value:
          type: string
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ConnectorOptionList:
      description: A list of choices for one select field.
      type: array
      items:
        $ref: "#/components/schemas/ConnectorOption"
    ConnectorShowWhen:
      description: ConnectorShowWhen shows a field only while another holds one of Equals.
      type: object
      required:
        - field
        - equals
      additionalProperties: false
      properties:
        field:
          type: string
        equals:
          type: array
          items:
            type: string
    ConnectorSignInMethod:
      description:
        'ConnectorSignInMethod is a way to sign in: "guided" (Foundry runs the tool''s sign-in
        on the device and relays the challenge) or "terminal" (the person runs Commands there;
        Foundry only checks).'
      type: object
      required:
        - id
        - kind
        - label
      additionalProperties: false
      properties:
        id:
          description: Sent to the adapter as `signInOptions.method`.
          type: string
        kind:
          type: string
          enum:
            - guided
            - terminal
          x-go-type: string
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
        descriptions:
          type: object
          additionalProperties:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorField"
        commands:
          description: "terminal: what to run there, the first being the usual one."
          type: array
          items:
            type: string
        scopesGroup:
          description:
            "guided: the authorization group whose scopes the person chooses before signing in;
            the choice reaches the adapter as signInOptions.scopes (comma-separated)."
          type: string
    ConnectorSignIn:
      description: ConnectorSignIn lists a connector's sign-in methods.
      type: object
      required:
        - methods
      additionalProperties: false
      properties:
        methods:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorSignInMethod"
        signOut:
          description:
            "`signOut` false: the tool is signed out in its own terminal, not from the page
            (absent: Foundry may sign it out)."
          type: boolean
          x-go-type-skip-optional-pointer: false
        repeat:
          description:
            Signing in again adds another login rather than replacing it (another Limen profile);
            a signed-in device offers it under this label.
          $ref: "#/components/schemas/ConnectorSignInRepeat"
          x-go-type-skip-optional-pointer: false
    ConnectorSignInRepeat:
      description: The label of the offer to sign in again.
      type: object
      required:
        - label
      additionalProperties: false
      properties:
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ConnectorProvides:
      description:
        "ConnectorProvides is what a connector gives: a tool sessions run, model access for the
        device (an external model connection)."
      type: object
      additionalProperties: false
      properties:
        tool:
          type: boolean
        modelAccess:
          $ref: "#/components/schemas/ConnectorModelAccess"
          x-go-type-skip-optional-pointer: false
    ConnectorModelRuntime:
      description: A runtime a model-access connector can serve.
      type: string
      enum:
        - claude
      x-go-type: string
    ConnectorModelAccess:
      description: ConnectorModelAccess names the runtimes a model-access connector serves.
      type: object
      required:
        - runtimes
      additionalProperties: false
      properties:
        runtimes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorModelRuntime"
    ConnectorExtensionSource:
      description: ConnectorExtensionSource names the extension a connector comes from.
      type: object
      required:
        - id
        - name
        - version
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        bundled:
          description: The extension ships with the Worker.
          type: boolean
          x-go-type-skip-optional-pointer: false
        bundledVersion:
          description:
            The bundled copy's version, when this installed local folder is newer than the
            copy shipped with the Worker and was kept in place.
          type: string
        state:
          description:
            '"installed" is on this device; "available" ships with the Worker but is not installed
            there. An absent state means installed, for descriptors reported by older Workers.'
          type: string
          enum:
            - installed
            - available
          x-go-type: string
        autoUpdate:
          description: A git-installed extension updates when its source moves; default true.
          type: boolean
          x-go-type-skip-optional-pointer: false
        source:
          description: Where its files come from, so other devices can install it too.
          $ref: "#/components/schemas/ConnectorExtensionRepository"
          x-go-type-skip-optional-pointer: false
        commit:
          description: The commit this device installed, when installed from source.
          type: string
        latestCommit:
          description: The commit source.ref is at now, when the device last looked.
          type: string
    ConnectorRepositoryAccess:
      description:
        A device-held connector can check whether its own login can read a source repository.
        The Worker runs this argv with the connector's ordinary Foundry environment.
      type: object
      required:
        - args
      additionalProperties: false
      properties:
        args:
          description: Exactly one {repository} placeholder may appear.
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        repositoryFormat:
          description:
            "`github` accepts an owner/repo or GitHub URL and passes owner/repo; raw passes the
            declared value."
          type: string
          enum:
            - raw
            - github
          x-go-type: string
    ConnectorSourceAccess:
      description:
        A connector is visible only when one of the owner's devices can read the repository
        through the named Foundry connector.
      type: object
      required:
        - via
        - repository
      additionalProperties: false
      properties:
        via:
          description: A connector kind that declares repositoryAccess.
          type: string
        repository:
          description: owner/repo or an https repository address.
          type: string
        hint:
          type: string
        hints:
          type: object
          additionalProperties:
            type: string
    ConnectorSourceAccessCheck:
      description: A device's last check of one source repository through a Foundry connector.
      type: object
      required:
        - status
        - checkedAt
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
            - no_access
            - not_signed_in
            - unreachable
            - error
          x-go-type: string
        checkedAt:
          type: string
        identity:
          description: The non-secret account name of the connector login used.
          type: string
        detail:
          description: A short non-secret message from the connector.
          type: string
    ConnectorRequirementsCheck:
      description:
        A device's last check of a connector's declared visibility requirements, such as
        tcp_reachable.
      type: object
      required:
        - ok
        - checkedAt
      additionalProperties: false
      properties:
        ok:
          type: boolean
        checkedAt:
          type: string
        requirement:
          description: The first requirement the device did not meet.
          type: string
    ConnectorPackage:
      description:
        ConnectorPackage names the upstream Skill bundle and CLI a connector ships with. The
        bundle follows the upstream; its recorded commit is also the repository tool's version.
      type: object
      required:
        - upstream
        - skills
        - tools
      additionalProperties: false
      properties:
        upstream:
          $ref: "#/components/schemas/ConnectorPackageUpstream"
          x-go-type-skip-optional-pointer: false
        skills:
          $ref: "#/components/schemas/ConnectorPackageSkills"
          x-go-type-skip-optional-pointer: false
        tools:
          description: Programs from folders of the bundle's own upstream repository.
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/ConnectorPackageTool"
    ConnectorPackageUpstream:
      description: A GitHub repository whose Skills and tools move as one bundle version.
      type: object
      required:
        - via
        - repository
      additionalProperties: false
      properties:
        via:
          description: The connector whose Foundry-managed login reads the repository.
          type: string
        repository:
          description: A normalized https GitHub repository address.
          type: string
        ref:
          description: A branch or tag; empty follows the default release or branch.
          type: string
    ConnectorPackageSkills:
      description: The folder in Upstream holding the bundle's Skill folders.
      type: object
      required:
        - path
      additionalProperties: false
      properties:
        path:
          type: string
    ConnectorPackageTool:
      description: A CLI from a folder of the package's upstream repository.
      type: object
      required:
        - command
        - source
        - path
        - bins
      additionalProperties: false
      properties:
        command:
          type: string
        source:
          type: string
          enum:
            - repository
          x-go-type: string
        path:
          description: The folder in Upstream holding the tool's files.
          type: string
        bins:
          description: Command names mapped to relative files under Path.
          type: object
          minProperties: 1
          additionalProperties:
            type: string
    ConnectorPackageDevice:
      description: One of the owner's devices in a package view, and whether it may be selected.
      type: object
      required:
        - deviceId
        - name
        - online
        - selected
        - eligible
      additionalProperties: false
      properties:
        deviceId:
          type: string
        name:
          type: string
        online:
          type: boolean
        selected:
          type: boolean
        eligible:
          type: boolean
        reason:
          description: Why the device cannot be selected, when Eligible is false.
          type: string
        reasonCode:
          description: Machine-readable form of Reason when the cause is that no instance is usable here.
          type: string
          enum: [no_instance]
        instances:
          description:
            Ready instances of a server-held connector whose sessions on this device can use them.
            Absent for connectors without instances.
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPackageInstanceRef"
        state:
          description:
            Where applying the selection stands on this device. Selecting a device returns at once
            with pending; the install runs in the background. Absent when the device has no part in
            the package.
          type: string
          enum: [pending, installing, installed, failed]
        error:
          description: Why the install or removal failed, when State is failed.
          type: string
    ConnectorPackageInstanceRef:
      description: A server-held instance, as named in a package view.
      type: object
      required:
        - id
        - label
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
    ConnectorPackageInstance:
      description: A Ready instance of a server-held connector and the devices where sessions can use it.
      type: object
      required:
        - id
        - label
        - network
        - deviceIds
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        network:
          type: string
          description: server (every device) or device (only the devices that probed it).
        deviceIds:
          type: array
          items:
            type: string
    ConnectorPackageView:
      description: A package at the person level, its bundle, and where it is enabled.
      type: object
      required:
        - connector
        - enabled
        - devices
      additionalProperties: false
      properties:
        connector:
          $ref: "#/components/schemas/ConnectorDescriptor"
          x-go-type-skip-optional-pointer: false
        enabled:
          type: boolean
        repositoryId:
          type: string
        instances:
          description: Ready instances of a server-held connector, with the devices that can use each.
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPackageInstance"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPackageDevice"
    SetConnectorPackageDevicesInput:
      description: Replace the devices on which a package is enabled.
      type: object
      required:
        - deviceIds
      additionalProperties: false
      properties:
        deviceIds:
          type: array
          items:
            type: string
    ConnectorExtensionRepository:
      description:
        A folder of a git repository holding an extension (docs/connector-extensions.md). The
        device fetches it with its own git credentials (SSH keys, credential helpers such as
        GitHub CLI's).
      type: object
      required:
        - git
      additionalProperties: false
      properties:
        git:
          description: https://… or an ssh / scp-style remote.
          type: string
        path:
          description: The folder with foundry-extension.json; the repository's root when empty.
          type: string
        ref:
          description: A branch or tag; the default branch when empty.
          type: string
    ConnectorSetup:
      description: ConnectorSetup is how to set an extension connector up on another device.
      type: object
      additionalProperties: false
      properties:
        command:
          type: string
        url:
          type: string
    ConnectorHolding:
      description: Who holds a connector's credential.
      type: string
      enum:
        - server_held
        - device_held
      x-go-type: string
    ConnectorServerHeldSpec:
      description:
        ConnectorServerHeld declares a pure-data server-held connector supplied by an
        extension. Foundry probes and proxies it generically; extension code never runs
        on the server.
      type: object
      required:
        - instances
        - fields
        - steps
        - probe
        - upstream
        - access
        - session
        - network
      additionalProperties: false
      properties:
        instances:
          type: string
          enum: [one, many]
          x-go-type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorField"
        steps:
          description: Field ids grouped into the form's steps; presentation data for Web.
          type: array
          items:
            $ref: "#/components/schemas/ConnectorServerHeldStep"
        probe:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorServerHeldProbe"
        upstream:
          $ref: "#/components/schemas/ConnectorServerHeldUpstream"
        access:
          $ref: "#/components/schemas/ConnectorServerHeldAccess"
        session:
          $ref: "#/components/schemas/ConnectorServerHeldSession"
        network:
          $ref: "#/components/schemas/ConnectorServerHeldNetwork"
    ConnectorServerHeldStep:
      description: One group of field ids in a server-held instance form.
      type: array
      items:
        type: string
    ConnectorServerHeldProbeExtract:
      type: object
      additionalProperties: false
      properties:
        values:
          description: Probe id to display name to JSON pointer.
          type: object
          additionalProperties:
            type: string
        options:
          $ref: "#/components/schemas/ConnectorServerHeldOptionsExtract"
        routes:
          $ref: "#/components/schemas/ConnectorServerHeldRoutesExtract"
    ConnectorServerHeldOptionsExtract:
      type: object
      required: [items, value, label]
      additionalProperties: false
      properties:
        items:
          description: JSON pointer to the array of option objects.
          type: string
        value:
          description: JSON pointer inside each item to its value.
          type: string
        label:
          description: JSON pointer inside each item to its label.
          type: string
    ConnectorServerHeldRoutesExtract:
      type: object
      required: [items, method, path, access]
      additionalProperties: false
      properties:
        items:
          description: JSON pointer to the array of route objects.
          type: string
        method:
          description: JSON pointer inside each route to its HTTP method.
          type: string
        path:
          description: JSON pointer inside each route to its path template.
          type: string
        access:
          description: JSON pointer inside each route to read/write classification.
          type: string
        domain:
          description: Optional JSON pointer inside each route to its resource domain.
          type: string
    ConnectorServerHeldProbe:
      type: object
      required: [id, method, path]
      additionalProperties: false
      properties:
        id:
          type: string
        method:
          type: string
        path:
          description: Path appended to the upstream base; must name a declared base field.
          type: string
        optional:
          description: A 404 from this probe is skipped and later probes continue.
          type: boolean
        extract:
          $ref: "#/components/schemas/ConnectorServerHeldProbeExtract"
    ConnectorServerHeldUpstream:
      type: object
      required: [baseField, pathPrefix]
      additionalProperties: false
      properties:
        baseField:
          description: Id of a declared URL field that holds the upstream base.
          type: string
        pathPrefix:
          description: Only paths at or below this prefix may reach the upstream.
          type: string
        headers:
          description:
            Templates for upstream request headers. Only this object may use
            `{secret:<field-id>}`.
          type: object
          additionalProperties:
            type: string
        requestBodyLimitBytes:
          type: integer
