openapi: 3.1.0
info:
  title: Foundry personal agent
  version: 1.0.0
  description: Personal Agent maintenance. Part of the Foundry contract
    (contracts/foundry.openapi.yaml); `pnpm generate:contracts` generates its TypeScript types and
    Go models (apps/server/internal/store/personal_agent_gen.go).
x-oapi-codegen:
  output-options:
    prefer-skip-optional-pointer: true
    # The store already has these three as hand-written structs (store/
    # personal_agent_list.go, used by the assistant's planning); the contract
    # names them, Go keeps its own.
    exclude-schemas:
      - PersonalAgentItemPlan
      - PersonalAgentWorkReference
      - PersonalAgentCompletionEvidence
paths: {}
components:
  schemas:
    ConnectorAccessLevel:
      description: What one assistant may do through one connector account.
      type: string
      enum:
        - "off"
        - read
        - write
      x-go-type: string
    PermissionListScope:
      description: >-
        What an include list means. all (the default when absent) lets an
        empty include list reach every object the person can already reach;
        listed reaches only the included objects, none while it is empty.
      type: string
      enum:
        - all
        - listed
      x-go-type: string
    PermissionListRule:
      description: >-
        An include/exclude rule. With scope all (or none given) an empty
        include list means every object the person can already reach; with
        scope listed only the included ones. Exclude always removes one.
      type: object
      required:
        - include
        - exclude
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/PermissionListScope"
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
    ConnectorAccountPermission:
      description: >-
        One connector account's override in a permission package. An account
        with no entry uses connectorDefault.
      type: object
      required:
        - accountId
        - level
      additionalProperties: false
      properties:
        accountId:
          type: string
        level:
          $ref: "#/components/schemas/ConnectorAccessLevel"
    PermissionIdentityResources:
      description: >-
        The resources that carry an identity (a signed-in browser, screen
        control, a device CLI account, a phone) the assistant and its helpers
        may lease. With scope all they follow the device like every other
        resource (compute, GPU, containers, toolchains, disks, simulators):
        any device with a workspace the package allows. With scope listed
        only the allowed ones.
      type: object
      required:
        - scope
        - allowed
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/PermissionListScope"
        allowed:
          description: Resource ids (res_…) the assistant may lease under scope listed.
          type: array
          items:
            type: string
    PermissionPackage:
      description: >-
        One assistant's permissions, applied to its own conversation and to
        every helper it starts. Workspaces default to all visible, accounts
        not named in connectorAccounts use connectorDefault, and identity
        resources follow the device (a new assistant's packages list none).
        Skills are not part of it: they follow the workspace.
      type: object
      x-stored: true
      required:
        - id
        - owner
        - workspaces
        - connectorDefault
        - connectorAccounts
        - identityResources
      additionalProperties: false
      properties:
        id:
          type: string
        owner:
          description: The Foundry user id the package belongs to.
          type: string
        workspaces:
          $ref: "#/components/schemas/PermissionListRule"
        connectorDefault:
          description: >-
            What connector accounts without an entry in connectorAccounts may
            do. Existing assistants use write; later assistants start at off.
          $ref: "#/components/schemas/ConnectorAccessLevel"
        connectorAccounts:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorAccountPermission"
        identityResources:
          $ref: "#/components/schemas/PermissionIdentityResources"
    PersonalAgentConnector:
      description: One connector account as the Assistant settings list it.
      type: object
      required:
        - id
        - kind
        - label
        - holding
        - level
        - enabled
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        displayName:
          description: >-
            Who the account belongs to at the provider, when known; unlike
            label, this is not the person's custom name for the connector.
          type: string
        appName:
          description: The provider app's own name, when known.
          type: string
        tenantName:
          description: The organisation's name at the provider, when known.
          type: string
        orgDomain:
          description: >-
            The organisation's email domain, used when its name is unavailable.
          type: string
        identity:
          description: Who is signed in to a device-held connector, when read.
          type: string
        sites:
          description: Sites or hosts the device-held connector is signed in to.
          type: array
          items:
            type: string
        holding:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        status:
          type: string
        level:
          $ref: "#/components/schemas/ConnectorAccessLevel"
        enabled:
          description: Kept for older clients; equivalent to level not being "off".
          type: boolean
    PersonalAgentConnectorsView:
      type: object
      required:
        - connectors
      additionalProperties: false
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentConnector"
    SetPersonalAgentConnectorLevelsInput:
      description: >-
        Replace the connector-account levels in the assistant's permission
        package. Omitted accounts return to the package's connectorDefault.
      type: object
      additionalProperties: false
      properties:
        levels:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorAccountPermission"
        disabled:
          description: Legacy form of levels; these accounts become "off".
          type: array
          items:
            type: string
    ContextPatchReply:
      type: object
      required:
        - operationId
        - path
        - hash
        - state
      additionalProperties: false
      properties:
        operationId:
          type: string
        path:
          type: string
        hash:
          type: string
        content:
          type: string
        state:
          type: string
        error:
          type: string
        code:
          type: string
    AssistantSummary:
      description: >-
        One of the person's assistants as GET /api/assistants lists it
        (DEV-191). Exactly one is the default, the one /api/personal-agent
        answers.
      type: object
      required:
        - id
        - name
        - isDefault
        - workspaceId
        - homeDeviceId
        - state
        - permissionPackageId
        - feishuAppId
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          description: The assistant id (asst_…).
          type: string
        name:
          description: Its label; empty means the language's default name.
          type: string
        isDefault:
          type: boolean
        workspaceId:
          description: Its home workspace (kind personal_agent), one per assistant.
          type: string
        homeDeviceId:
          type: string
        state:
          type: string
        permissionPackageId:
          type: string
        feishuAppId:
          description: >-
            The Feishu app this assistant answers direct chats for, or empty.
            One app binds at most one assistant per owner.
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    AssistantList:
      description: The person's assistants, the default first.
      type: object
      required:
        - assistants
      additionalProperties: false
      properties:
        assistants:
          type: array
          items:
            $ref: "#/components/schemas/AssistantSummary"
    CreateAssistantInput:
      description: >-
        POST /api/assistants. Creates a home workspace on homeDeviceId as setup
        does; the new assistant's permission package reaches no workspace
        until the person adds them.
      type: object
      required:
        - name
        - homeDeviceId
      additionalProperties: false
      properties:
        name:
          type: string
        homeDeviceId:
          type: string
    UpdateAssistantInput:
      description: PATCH /api/assistants/{id}. Absent fields stay.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
    MemoryLayerScope:
      description: >-
        A layer of the person's memory (DEV-191). person is recalled by every
        assistant of theirs (how to address them, language, style, tools,
        general preferences); assistant only by that assistant (the people,
        projects and arrangements of its domain).
      type: string
      enum:
        - person
        - assistant
    MemoryLayerEntry:
      description: One current entry of a memory layer, metadata only; read
        its body from the knowledge entry route of its vault.
      type: object
      required:
        - id
        - vaultId
        - scope
        - title
        - revision
        - hash
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        vaultId:
          type: string
        scope:
          $ref: "#/components/schemas/MemoryLayerScope"
        title:
          type: string
        revision:
          type: integer
          format: int64
        hash:
          type: string
        sourceRef:
          type: string
        expiresAt:
          type: string
        updatedAt:
          type: string
    MemoryLayer:
      description: >-
        One layer of an assistant's memory. vaultId is absent until the
        layer is first needed; then state is its vault's (pending until its
        device initializes it, active).
      type: object
      required:
        - scope
        - entries
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/MemoryLayerScope"
        vaultId:
          type: string
        state:
          type: string
        reason:
          type: string
        workspaceId:
          type: string
        deviceId:
          type: string
        rootPath:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MemoryLayerEntry"
    AssistantMemoryLayers:
      description: >-
        GET /api/assistants/{id}/memory/layers. What the assistant recalls:
        the person's layer first, then its own. legacyUncopied counts the
        active legacy facts (read-only pa_memory) not yet copied to the
        person's layer.
      type: object
      required:
        - assistantId
        - layers
        - legacyUncopied
      additionalProperties: false
      properties:
        assistantId:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/MemoryLayer"
        legacyUncopied:
          type: integer
    AddMemoryEntryInput:
      description: >-
        POST /api/assistants/{id}/memory/layers/{scope}/entries. The person
        writes a fact into a layer, which is created the first time;
        requestId makes a retry the same write.
      type: object
      required:
        - requestId
        - title
        - body
      additionalProperties: false
      properties:
        requestId:
          type: string
        title:
          type: string
        body:
          type: string
        expiresAt:
          type: string
    MoveMemoryEntryInput:
      description: >-
        POST /api/assistants/{id}/memory/entries/{entry}/move. Moves the
        entry of the assistant's other layer to toScope, at the revision and
        hash the person saw.
      type: object
      required:
        - toScope
        - expectedRevision
        - expectedHash
      additionalProperties: false
      properties:
        toScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        expectedRevision:
          type: integer
          format: int64
        expectedHash:
          type: string
    MemorySortRecord:
      description: >-
        One decision of memory upkeep's sorting between the person's layer
        and one assistant's (DEV-191): an automatic move (kind move, status
        moving, moved, failed or undone) or a suggestion to share (kind
        suggestion, status suggested, confirmed or dismissed). assistantId is
        the assistant whose layer is the other side. title is the entry's
        title and reason the reviewer's one sentence; bodies are never
        recorded. undoable is whether the person can move it back now.
      type: object
      required:
        - id
        - kind
        - status
        - assistantId
        - assistantName
        - assistantIsDefault
        - fromScope
        - toScope
        - title
        - reason
        - confidence
        - mentions
        - undoable
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [move, suggestion]
        status:
          type: string
        assistantId:
          type: string
        assistantName:
          type: string
        assistantIsDefault:
          type: boolean
        fromScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        toScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        title:
          type: string
        reason:
          type: string
        confidence:
          type: string
        mentions:
          type: array
          items:
            type: string
        failure:
          type: string
        undoable:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    MemorySortList:
      description: >-
        GET /api/assistants/{id}/memory/sorting. The person's recent
        automatic moves between layers (any of their assistants), newest
        first, and the suggestions to share that still stand.
      type: object
      required:
        - moves
        - suggestions
      additionalProperties: false
      properties:
        moves:
          type: array
          items:
            $ref: "#/components/schemas/MemorySortRecord"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MemorySortRecord"
    MemorySortActionInput:
      description: >-
        POST /api/assistants/{id}/memory/sorting/{record}/action. undo moves an
        automatic move back; confirm moves a suggested entry to the person's
        layer; dismiss drops the suggestion.
      type: object
      required:
        - action
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [undo, confirm, dismiss]
    MemoryEntryMove:
      description: >-
        A captured move: the body is written to targetEntryId in the target
        layer and the source entry forgotten, each applied by its device.
      type: object
      required:
        - fromScope
        - toScope
        - sourceEntryId
        - targetVaultId
        - targetEntryId
        - status
      additionalProperties: false
      properties:
        fromScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        toScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        sourceEntryId:
          type: string
        targetVaultId:
          type: string
        targetEntryId:
          type: string
        status:
          type: string
    # 「事项」 (DEV-258): one list of what someone wants done. The assistant
    # decides what an item is, who does it and what its summary says; Foundry
    # records the mechanics (times, state changes, helpers, archive) and
    # shows them here. Same JSON names as store.PersonalAgentListItem.
    PersonalAgentItemOwner:
      description: Who is to do the item (pa_items.owner).
      type: string
      enum:
        - person
        - assistant
      x-go-type: string
    PersonalAgentItemStatus:
      description: An item is open, done or dropped; "in progress" and "waiting" are derived from its helpers and needs_you items, never stored.
      type: string
      enum:
        - open
        - done
        - dropped
      x-go-type: string
    PersonalAgentItemOriginKind:
      description: Where an item started.
      type: string
      enum:
        - web
        - channel
        - self_chat
      x-go-type: string
    PersonalAgentItemOrigin:
      description: >-
        Where the item started and the message it rests on. Foundry records
        this mechanically; the assistant never writes it. A channel item
        names the channel and the requester whose message asked for it.
      type: object
      required:
        - kind
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/PersonalAgentItemOriginKind"
        name:
          description: The channel or conversation name the message came from.
          type: string
        source:
          description: The channel's source kind, e.g. openlark.
          type: string
        requester:
          description: Display name of the person whose message started the item.
          type: string
        requesterId:
          type: string
        sessionId:
          description: The assistant conversation that received the message.
          type: string
        messageId:
          type: string
    PersonalAgentItemEventActor:
      description: >-
        Who caused the change an event records. session is a session the
        person started in a workspace, changing an item whose home is there.
      type: string
      enum:
        - person
        - assistant
        - foundry
        - session
      x-go-type: string
    PersonalAgentItemEventKind:
      description: The mechanical fact an event records.
      type: string
      enum:
        - created
        - edited
        - owner_changed
        - status_changed
        - summary_updated
        - helper_started
        - helper_ended
        - needs_you_opened
        - needs_you_answered
        - archived
        - restored
        - claimed
        - released
        - rehomed
      x-go-type: string
    PersonalAgentItemEventDetail:
      description: >-
        The small difference an event records; fields absent when they do
        not apply. A helper event names its session and workspace, a
        needs_you event its item. claimed names the new holder (sessionId)
        and the holder it replaced (from); released the holder that let go
        (sessionId); rehomed the home before and after (from, to; empty is
        the assistant's inbox).
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
        sessionId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        needsYouId:
          type: string
        reason:
          type: string
    PersonalAgentItemEvent:
      description: One append-only fact in an item's timeline (pa_item_events).
      type: object
      required:
        - id
        - itemId
        - at
        - actor
        - kind
      additionalProperties: false
      properties:
        id:
          type: string
        itemId:
          type: string
        at:
          type: string
        actor:
          $ref: "#/components/schemas/PersonalAgentItemEventActor"
        kind:
          $ref: "#/components/schemas/PersonalAgentItemEventKind"
        detail:
          $ref: "#/components/schemas/PersonalAgentItemEventDetail"
          x-go-type-skip-optional-pointer: false
    PersonalAgentItemHelper:
      description: >-
        One helper session that works or worked on the item: one of the
        assistant's tasks on it (pa_tasks.item_id), or a helper a workspace
        session tied to it (pa_item_helpers), each session once. A helper
        started without an item is not here; it stays its own task.
      type: object
      required:
        - sessionId
        - status
        - readOnly
      additionalProperties: false
      properties:
        sessionId:
          type: string
        title:
          type: string
        project:
          description: The workspace's name, when it still exists.
          type: string
        workspaceId:
          type: string
        status:
          description: queued, running, asking, done, failed or cancelled.
          type: string
        readOnly:
          type: boolean
        startedAt:
          type: string
        endedAt:
          type: string
        archived:
          description: The helper's session is archived.
          type: boolean
    PersonalAgentItemPlan:
      description: >-
        The assistant's plan for executing the item (plan_json), as it is
        today: how it routes, its progress, the next action and what it waits
        for, the project it runs in, items it depends on, the work it
        references and the completion evidence. Operational state, not the
        person's intent; absent on items with none.
      type: object
      required:
        - mode
        - progress
      additionalProperties: false
      properties:
        route:
          $ref: "#/components/schemas/PersonalAgentItemRouteDecision"
        mode:
          description: record unless the person asked the assistant to execute.
          type: string
        progress:
          type: string
          enum:
            - inbox
            - ready
            - waiting
            - working
            - review
        nextAction:
          type: string
        waitingFor:
          type: string
        workspaceId:
          description: >-
            The item's homeWorkspaceId, repeated for older readers. Not stored
            in the plan; a write of it moves the item's home.
          type: string
        dependencies:
          type: array
          items:
            type: string
        workRefs:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentWorkReference"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentCompletionEvidence"
    PersonalAgentItemRouteDecision:
      description: The assistant's explainable routing decision for an item.
      type: object
      required:
        - kind
        - reason
        - needsClarification
      additionalProperties: false
      x-go-type: PersonalAgentRouteDecision
      properties:
        kind:
          type: string
          enum:
            - record
            - continue
            - existing
            - create
            - multiple
            - clarify
        reason:
          type: string
        alternatives:
          type: array
          items:
            type: string
        needsClarification:
          type: boolean
    PersonalAgentWorkReference:
      description: One session, Issue or service the item's work refers to.
      type: object
      required:
        - kind
        - id
        - workspaceId
        - relation
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - session
            - issue
            - service
        id:
          type: string
        workspaceId:
          type: string
        relation:
          type: string
          enum:
            - observing
            - executing
            - dependency
    PersonalAgentCompletionEvidence:
      description: What showed the item's work was done.
      type: object
      required:
        - kind
        - ref
        - summary
        - observedAt
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - session
            - issue
            - file
            - url
            - user
        ref:
          type: string
        summary:
          type: string
        observedAt:
          type: string
    PersonalAgentItem:
      description: >-
        One thing someone wants done or plans, in their words, as the side
        card and the items page show it. The assistant's list owns the
        content; Foundry fills times, derived helper state and archive.
      type: object
      required:
        - id
        - owner
        - text
        - status
        - remind
        - revision
        - createdAt
        - updatedAt
        - helpers
      additionalProperties: false
      properties:
        id:
          type: string
        intentRevision:
          type: integer
        revision:
          type: integer
        owner:
          $ref: "#/components/schemas/PersonalAgentItemOwner"
        text:
          type: string
        when:
          type: string
        at:
          type: string
        remind:
          type: boolean
        status:
          $ref: "#/components/schemas/PersonalAgentItemStatus"
        summary:
          description: >-
            The assistant's short running context in Markdown, at most 1500
            characters: what was asked, what has been done, the result or
            answer, what is still open. Foundry never writes it.
          type: string
          maxLength: 1500
        quote:
          type: string
        origin:
          $ref: "#/components/schemas/PersonalAgentItemOrigin"
          x-go-type-skip-optional-pointer: false
        plan:
          $ref: "#/components/schemas/PersonalAgentItemPlan"
          x-go-type-skip-optional-pointer: false
        homeWorkspaceId:
          description: >-
            The workspace responsible for the item; absent when the assistant
            looks after it in its own home (the inbox).
          type: string
        touches:
          description: >-
            The other workspaces the item touches: where its helpers run, each
            once, without the home. Derived when read, never stored.
          type: array
          items:
            type: string
        holderSessionId:
          description: >-
            The session that claimed the item and follows it now; absent when
            none has. A new claim replaces the holder.
          type: string
        archivedAt:
          type: string
        remindedAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        closedAt:
          type: string
        helpers:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentItemHelper"
    PersonalAgentItemDetail:
      description: >-
        GET /api/personal-agent/items/{id}: the item, its timeline and its
        helpers.
      type: object
      required:
        - item
        - events
      additionalProperties: false
      properties:
        item:
          $ref: "#/components/schemas/PersonalAgentItem"
        events:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentItemEvent"
    PersonalAgentItemList:
      description: >-
        GET /api/personal-agent/items. Query: view (open | finished | archived;
        default open: open = status open and not archived, finished = done or
        dropped and not archived, archived = archivedAt set); owner
        (person | assistant); from and to (RFC 3339 instants, the range is
        [from, to), filtering updatedAt; the row shows when it last changed);
        workspace (a workspace id: the items whose home is it or that touch
        it); q (case-insensitive substring of text and summary); limit (default 50,
        max 200) and offset. Newest-updated first. createdAt, closedAt and
        archivedAt come back on every item so the Web can show them. Items
        are the person's list only; the report is GET .../items/report.
      type: object
      required:
        - items
        - total
        - offset
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentItem"
        total:
          description: How many items match the filters.
          type: integer
        offset:
          type: integer
        nextOffset:
          description: Pass as offset for the next page; absent on the last one.
          type: integer
          x-go-type-skip-optional-pointer: false
    PersonalAgentItemPlanChoice:
      description: >-
        The person's choice of how an open item runs, sent as part of the edit.
        Only what the person can choose: the route, the project (workspaceId)
        and the items it depends on. Foundry merges it over the assistant's
        plan and keeps the rest (progress, next action, waiting, work refs,
        evidence). Absent fields stay. Dependencies are checked for cycles;
        a cycle is refused with 400.
      type: object
      additionalProperties: false
