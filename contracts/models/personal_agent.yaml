openapi: 3.1.0
info:
  title: Foundry personal agent
  version: 1.0.0
  description: Personal Agent maintenance. Part of the Foundry contract
    (contracts/foundry.openapi.yaml); `pnpm generate:contracts` generates its TypeScript types and
    Go models (apps/server/internal/store/personal_agent_gen.go).
x-oapi-codegen:
  output-options:
    prefer-skip-optional-pointer: true
paths: {}
components:
  schemas:
    ConnectorAccessLevel:
      description: What one assistant may do through one connector account.
      type: string
      enum:
        - "off"
        - read
        - write
      x-go-type: string
    PermissionListScope:
      description: >-
        What an include list means. all (the default when absent) lets an
        empty include list reach every object the person can already reach;
        listed reaches only the included objects, none while it is empty.
      type: string
      enum:
        - all
        - listed
      x-go-type: string
    PermissionListRule:
      description: >-
        An include/exclude rule. With scope all (or none given) an empty
        include list means every object the person can already reach; with
        scope listed only the included ones. Exclude always removes one.
      type: object
      required:
        - include
        - exclude
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/PermissionListScope"
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
    ConnectorAccountPermission:
      description: >-
        One connector account's override in a permission package. An account
        with no entry uses connectorDefault.
      type: object
      required:
        - accountId
        - level
      additionalProperties: false
      properties:
        accountId:
          type: string
        level:
          $ref: "#/components/schemas/ConnectorAccessLevel"
    PermissionIdentityResources:
      description: >-
        The resources that carry an identity (a signed-in browser, screen
        control, a device CLI account, a phone) the assistant and its helpers
        may lease. With scope all they follow the device like every other
        resource (compute, GPU, containers, toolchains, disks, simulators):
        any device with a workspace the package allows. With scope listed
        only the allowed ones.
      type: object
      required:
        - scope
        - allowed
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/PermissionListScope"
        allowed:
          description: Resource ids (res_…) the assistant may lease under scope listed.
          type: array
          items:
            type: string
    PermissionPackage:
      description: >-
        One assistant's permissions, applied to its own conversation and to
        every helper it starts. Workspaces default to all visible, accounts
        not named in connectorAccounts use connectorDefault, and identity
        resources follow the device (a new assistant's packages list none).
        Skills are not part of it: they follow the workspace.
      type: object
      x-stored: true
      required:
        - id
        - owner
        - workspaces
        - connectorDefault
        - connectorAccounts
        - identityResources
      additionalProperties: false
      properties:
        id:
          type: string
        owner:
          description: The Foundry user id the package belongs to.
          type: string
        workspaces:
          $ref: "#/components/schemas/PermissionListRule"
        connectorDefault:
          description: >-
            What connector accounts without an entry in connectorAccounts may
            do. Existing assistants use write; later assistants start at off.
          $ref: "#/components/schemas/ConnectorAccessLevel"
        connectorAccounts:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorAccountPermission"
        identityResources:
          $ref: "#/components/schemas/PermissionIdentityResources"
    PersonalAgentConnector:
      description: One connector account as the Assistant settings list it.
      type: object
      required:
        - id
        - kind
        - label
        - holding
        - level
        - enabled
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        displayName:
          description: >-
            Who the account belongs to at the provider, when known; unlike
            label, this is not the person's custom name for the connector.
          type: string
        appName:
          description: The provider app's own name, when known.
          type: string
        tenantName:
          description: The organisation's name at the provider, when known.
          type: string
        orgDomain:
          description: >-
            The organisation's email domain, used when its name is unavailable.
          type: string
        identity:
          description: Who is signed in to a device-held connector, when read.
          type: string
        sites:
          description: Sites or hosts the device-held connector is signed in to.
          type: array
          items:
            type: string
        holding:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        status:
          type: string
        level:
          $ref: "#/components/schemas/ConnectorAccessLevel"
        enabled:
          description: Kept for older clients; equivalent to level not being "off".
          type: boolean
    PersonalAgentConnectorsView:
      type: object
      required:
        - connectors
      additionalProperties: false
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAgentConnector"
    SetPersonalAgentConnectorLevelsInput:
      description: >-
        Replace the connector-account levels in the assistant's permission
        package. Omitted accounts return to the package's connectorDefault.
      type: object
      additionalProperties: false
      properties:
        levels:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorAccountPermission"
        disabled:
          description: Legacy form of levels; these accounts become "off".
          type: array
          items:
            type: string
    ContextPatchReply:
      type: object
      required:
        - operationId
        - path
        - hash
        - state
      additionalProperties: false
      properties:
        operationId:
          type: string
        path:
          type: string
        hash:
          type: string
        content:
          type: string
        state:
          type: string
        error:
          type: string
        code:
          type: string
    AssistantSummary:
      description: >-
        One of the person's assistants as GET /api/assistants lists it
        (DEV-191). Exactly one is the default, the one /api/personal-agent
        answers.
      type: object
      required:
        - id
        - name
        - isDefault
        - workspaceId
        - homeDeviceId
        - state
        - permissionPackageId
        - feishuAppId
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          description: The assistant id (asst_…).
          type: string
        name:
          description: Its label; empty means the language's default name.
          type: string
        isDefault:
          type: boolean
        workspaceId:
          description: Its home workspace (kind personal_agent), one per assistant.
          type: string
        homeDeviceId:
          type: string
        state:
          type: string
        permissionPackageId:
          type: string
        feishuAppId:
          description: >-
            The Feishu app this assistant answers direct chats for, or empty.
            One app binds at most one assistant per owner.
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    AssistantList:
      description: The person's assistants, the default first.
      type: object
      required:
        - assistants
      additionalProperties: false
      properties:
        assistants:
          type: array
          items:
            $ref: "#/components/schemas/AssistantSummary"
    CreateAssistantInput:
      description: >-
        POST /api/assistants. Creates a home workspace on homeDeviceId as setup
        does; the new assistant's permission package reaches no workspace
        until the person adds them.
      type: object
      required:
        - name
        - homeDeviceId
      additionalProperties: false
      properties:
        name:
          type: string
        homeDeviceId:
          type: string
    UpdateAssistantInput:
      description: PATCH /api/assistants/{id}. Absent fields stay.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
    MemoryLayerScope:
      description: >-
        A layer of the person's memory (DEV-191). person is recalled by every
        assistant of theirs (how to address them, language, style, tools,
        general preferences); assistant only by that assistant (the people,
        projects and arrangements of its domain).
      type: string
      enum:
        - person
        - assistant
    MemoryLayerEntry:
      description: One current entry of a memory layer, metadata only; read
        its body from the knowledge entry route of its vault.
      type: object
      required:
        - id
        - vaultId
        - scope
        - title
        - revision
        - hash
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        vaultId:
          type: string
        scope:
          $ref: "#/components/schemas/MemoryLayerScope"
        title:
          type: string
        revision:
          type: integer
          format: int64
        hash:
          type: string
        sourceRef:
          type: string
        expiresAt:
          type: string
        updatedAt:
          type: string
    MemoryLayer:
      description: >-
        One layer of an assistant's memory. vaultId is absent until the
        layer is first needed; then state is its vault's (pending until its
        device initializes it, active).
      type: object
      required:
        - scope
        - entries
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/MemoryLayerScope"
        vaultId:
          type: string
        state:
          type: string
        reason:
          type: string
        workspaceId:
          type: string
        deviceId:
          type: string
        rootPath:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MemoryLayerEntry"
    AssistantMemoryLayers:
      description: >-
        GET /api/assistants/{id}/memory/layers. What the assistant recalls:
        the person's layer first, then its own. legacyUncopied counts the
        active legacy facts (read-only pa_memory) not yet copied to the
        person's layer.
      type: object
      required:
        - assistantId
        - layers
        - legacyUncopied
      additionalProperties: false
      properties:
        assistantId:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/MemoryLayer"
        legacyUncopied:
          type: integer
    AddMemoryEntryInput:
      description: >-
        POST /api/assistants/{id}/memory/layers/{scope}/entries. The person
        writes a fact into a layer, which is created the first time;
        requestId makes a retry the same write.
      type: object
      required:
        - requestId
        - title
        - body
      additionalProperties: false
      properties:
        requestId:
          type: string
        title:
          type: string
        body:
          type: string
        expiresAt:
          type: string
    MoveMemoryEntryInput:
      description: >-
        POST /api/assistants/{id}/memory/entries/{entry}/move. Moves the
        entry of the assistant's other layer to toScope, at the revision and
        hash the person saw.
      type: object
      required:
        - toScope
        - expectedRevision
        - expectedHash
      additionalProperties: false
      properties:
        toScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        expectedRevision:
          type: integer
          format: int64
        expectedHash:
          type: string
    MemorySortRecord:
      description: >-
        One decision of memory upkeep's sorting between the person's layer
        and one assistant's (DEV-191): an automatic move (kind move, status
        moving, moved, failed or undone) or a suggestion to share (kind
        suggestion, status suggested, confirmed or dismissed). assistantId is
        the assistant whose layer is the other side. title is the entry's
        title and reason the reviewer's one sentence; bodies are never
        recorded. undoable is whether the person can move it back now.
      type: object
      required:
        - id
        - kind
        - status
        - assistantId
        - assistantName
        - assistantIsDefault
        - fromScope
        - toScope
        - title
        - reason
        - confidence
        - mentions
        - undoable
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [move, suggestion]
        status:
          type: string
        assistantId:
          type: string
        assistantName:
          type: string
        assistantIsDefault:
          type: boolean
        fromScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        toScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        title:
          type: string
        reason:
          type: string
        confidence:
          type: string
        mentions:
          type: array
          items:
            type: string
        failure:
          type: string
        undoable:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    MemorySortList:
      description: >-
        GET /api/assistants/{id}/memory/sorting. The person's recent
        automatic moves between layers (any of their assistants), newest
        first, and the suggestions to share that still stand.
      type: object
      required:
        - moves
        - suggestions
      additionalProperties: false
      properties:
        moves:
          type: array
          items:
            $ref: "#/components/schemas/MemorySortRecord"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MemorySortRecord"
    MemorySortActionInput:
      description: >-
        POST /api/assistants/{id}/memory/sorting/{record}/action. undo moves an
        automatic move back; confirm moves a suggested entry to the person's
        layer; dismiss drops the suggestion.
      type: object
      required:
        - action
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [undo, confirm, dismiss]
    MemoryEntryMove:
      description: >-
        A captured move: the body is written to targetEntryId in the target
        layer and the source entry forgotten, each applied by its device.
      type: object
      required:
        - fromScope
        - toScope
        - sourceEntryId
        - targetVaultId
        - targetEntryId
        - status
      additionalProperties: false
      properties:
        fromScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        toScope:
          $ref: "#/components/schemas/MemoryLayerScope"
        sourceEntryId:
          type: string
        targetVaultId:
          type: string
        targetEntryId:
          type: string
        status:
          type: string
