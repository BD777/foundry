openapi: 3.1.0
info:
  title: Foundry message channels
  version: 1.0.0
  description:
    Message channels (DEV-203) bring messages from a connector's event feed to one assistant.
    Part of the Foundry contract (contracts/foundry.openapi.yaml); `pnpm generate:contracts`
    generates its TypeScript types and Go models (apps/server/internal/store/message_channels_gen.go).
x-oapi-codegen:
  output-options:
    prefer-skip-optional-pointer: true
paths: {}
components:
  schemas:
    MessageEnvelope:
      description:
        One message as a channel sees it, whatever the source. IM sources fill conversation,
        thread, sender and mentionsMe; other sources use the same fields for their own notions
        (a mail thread, an alert group). attributes holds a few source-specific values.
      type: object
      required: [id, kind, op, conversation, sender, mentionsMe, text]
      additionalProperties: false
      properties:
        id:
          description: Unique within the source; the channel's deduplication key.
          type: string
        kind:
          type: string
        op:
          type: string
        occurredAt:
          type: string
        conversation:
          $ref: "#/components/schemas/MessageEnvelopeConversation"
        thread:
          $ref: "#/components/schemas/MessageEnvelopeThread"
        messageId:
          type: string
        sender:
          $ref: "#/components/schemas/MessageEnvelopeSender"
        mentionsMe:
          type: boolean
        text:
          type: string
        textTruncated:
          type: boolean
        attributes:
          type: object
          additionalProperties:
            type: string
    MessageEnvelopeConversation:
      type: object
      required: [id, kind]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/MessageConversationKind"
        name:
          type: string
    MessageConversationKind:
      type: string
      enum: [direct, self, group, channel, feed, other]
      x-go-type: string
    MessageEnvelopeThread:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        isReply:
          type: boolean
    MessageEnvelopeSender:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        isSelf:
          type: boolean
        isBot:
          type: boolean
        isOwnWrite:
          description:
            The message was written by the assistant itself through the source, not by a person; it
            never starts or continues a session.
          type: boolean
    MessageChannelTriState:
      description: A condition on a yes/no envelope field; any ignores it.
      type: string
      enum: [any, "yes", "no"]
      x-go-type: string
    MessageChannelRule:
      description:
        One filter rule; a message is kept when any enabled rule matches it. Every condition of a
        rule must hold. textPrefixes are compared after leading mentions and spaces are removed;
        an empty list accepts any text.
      type: object
      required:
        [id, enabled, conversationKinds, mentionsMe, fromSelf, textPrefixes]
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        conversationKinds:
          type: array
          items:
            $ref: "#/components/schemas/MessageConversationKind"
        mentionsMe:
          $ref: "#/components/schemas/MessageChannelTriState"
        fromSelf:
          $ref: "#/components/schemas/MessageChannelTriState"
        textPrefixes:
          type: array
          items:
            type: string
        caseSensitive:
          type: boolean
        conversationIds:
          type: array
          items:
            type: string
        excludeConversationIds:
          type: array
          items:
            type: string
        senderIds:
          type: array
          items:
            type: string
        excludeSenderIds:
          type: array
          items:
            type: string
    MessageChannelFilters:
      type: object
      required: [rules]
      additionalProperties: false
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelRule"
    MessageChannelConnectorScope:
      description:
        One connector account for the channel's sessions, capped by the assistant's permission
        package. writes direct lets them write through it without a confirmation card.
      type: object
      required: [accountId, level, writes]
      additionalProperties: false
      properties:
        accountId:
          type: string
        level:
          type: string
          enum: ["off", read, write]
          x-go-type: string
        writes:
          type: string
          enum: [confirm, direct]
          x-go-type: string
    MessageChannelScope:
      description:
        What the channel's sessions and their helpers may use, intersected with the assistant's
        permission package. connectorDefault inherit keeps the package's level for accounts not
        listed; off turns them off. workspaces listed keeps only the included ones.
      type: object
      required: [connectorDefault, connectors, workspaces, identityResources]
      additionalProperties: false
      properties:
        connectorDefault:
          type: string
          enum: [inherit, "off"]
          x-go-type: string
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelConnectorScope"
        workspaces:
          $ref: "./personal_agent.yaml#/components/schemas/PermissionListRule"
        identityResources:
          type: array
          items:
            type: string
    MessageChannelSessionRule:
      description:
        When a conversation's messages go to a new assistant session. idleMinutes, the time since the
        conversation's last message after which the next one starts a new session (0 never); never
        while the session is working. resetCommands, words that start a new session the way trigger
        words are matched (after the trigger word or alone). Missing means 240 minutes and no command.
      type: object
      required: [idleMinutes, resetCommands]
      additionalProperties: false
      properties:
        idleMinutes:
          type: integer
        resetCommands:
          type: array
          items:
            type: string
    MessageChannelFollowUpFrom:
      type: string
      enum: [same-sender, person, anyone]
      x-go-type: string
    MessageChannelFollowUps:
      description:
        Which messages continue a conversation without a trigger word once a message matched a rule.
        enabled turns it on; from says who may continue (same-sender, the sender of the message that
        started the session; person, the person the assistant works for; anyone). endCommands are
        words that stop it, matched like trigger words and never handed to the assistant. Missing
        means enabled, same-sender and /end.
      type: object
      required: [enabled, from, endCommands]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        from:
          $ref: "#/components/schemas/MessageChannelFollowUpFrom"
        endCommands:
          type: array
          items:
            type: string
    MessageChannelLimits:
      type: object
      required: [perHour, perDay, concurrency]
      additionalProperties: false
      properties:
        perHour:
          type: integer
        perDay:
          type: integer
        concurrency:
          type: integer
    MessageChannelSource:
      description: The connector instance whose event feed the channel reads.
      type: object
      required: [kind, accountId]
      additionalProperties: false
      properties:
        kind:
          type: string
        accountId:
          type: string
        instanceId:
          type: string
        label:
          type: string
        capabilities:
          $ref: "#/components/schemas/MessageChannelCapabilities"
          x-go-type-skip-optional-pointer: false
    MessageChannelCapabilities:
      description:
        What the source's messages can tell apart, from its descriptor's envelope mapping. An
        empty conversationKinds means the source does not say.
      type: object
      required: [conversationKinds, mentionsMe, fromSelf, threads]
      additionalProperties: false
      properties:
        conversationKinds:
          type: array
          items:
            $ref: "#/components/schemas/MessageConversationKind"
        mentionsMe:
          type: boolean
        fromSelf:
          type: boolean
        threads:
          description: The source gives a thread id, so follow-ups can ride threads.
          type: boolean
    MessageChannelSample:
      description: A message the person makes up to try the rules on.
      type: object
      required: [text, conversationKind, mentionsMe, fromSelf]
      additionalProperties: false
      properties:
        text:
          type: string
        conversationKind:
          $ref: "#/components/schemas/MessageConversationKind"
        mentionsMe:
          type: boolean
        fromSelf:
          type: boolean
        conversationId:
          type: string
        senderId:
          type: string
    MessageChannelTestInput:
      description:
        Rules to try before saving, on made-up samples and, with sourceAccountId and recent, on
        the source's recent messages that the person's channels saw.
      type: object
      required: [filters]
      additionalProperties: false
      properties:
        filters:
          $ref: "#/components/schemas/MessageChannelFilters"
        samples:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelSample"
        sourceAccountId:
          type: string
        recent:
          type: boolean
    MessageChannelRuleCheck:
      type: object
      required: [ruleId, miss]
      additionalProperties: false
      properties:
        ruleId:
          type: string
        miss:
          description: '"" when the rule matches; else place, mention, self, conversation, sender or trigger.'
          type: string
    MessageChannelVerdict:
      type: object
      required: [envelope, keep, checks]
      additionalProperties: false
      properties:
        sample:
          description: Index of the sample; absent for a recent message.
          type: integer
          x-go-type-skip-optional-pointer: false
        envelope:
          $ref: "#/components/schemas/MessageEnvelope"
        keep:
          type: boolean
        textUnknown:
          description:
            A recent message that no rule took keeps no text, so the trigger words could not be
            checked; keep and rule then say what holds if its text starts with a trigger word.
          type: boolean
        rule:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelRuleCheck"
    MessageChannelTestResult:
      type: object
      required: [verdicts]
      additionalProperties: false
      properties:
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelVerdict"
    MessageChannelPeer:
      description: A conversation or sender the person's channels saw recently from a source.
      type: object
      required: [id, name, count, lastSeenAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        conversationKind:
          $ref: "#/components/schemas/MessageConversationKind"
        count:
          type: integer
        lastSeenAt:
          type: string
    MessageChannelPeers:
      type: object
      required: [conversations, senders]
      additionalProperties: false
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelPeer"
        senders:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelPeer"
    MessageChannelInput:
      description: What the person sets on a channel.
      type: object
      required:
        [name, enabled, source, filters, guide, sessionKey, scope, limits]
      additionalProperties: false
      properties:
        name:
          type: string
        enabled:
          type: boolean
        source:
          $ref: "#/components/schemas/MessageChannelSource"
        filters:
          $ref: "#/components/schemas/MessageChannelFilters"
        guide:
          description: The person's handling principles; becomes the channel's skill in the assistant's home.
          type: string
        sessionKey:
          description: conversation gives each source conversation one session; thread one per thread.
          type: string
          enum: [conversation, thread]
          x-go-type: string
        scope:
          $ref: "#/components/schemas/MessageChannelScope"
        limits:
          $ref: "#/components/schemas/MessageChannelLimits"
        resumeFromNow:
          description: On enabling a paused channel, start from now instead of where it stopped.
          type: boolean
        workspaceId:
          description:
            The workspace the channel's sessions run in, read-only for them; its AGENTS.md is the
            person's instructions for the channel. Empty on input creates one beside the assistant's home.
          type: string
        session:
          $ref: "#/components/schemas/MessageChannelSessionRule"
          x-go-type-skip-optional-pointer: false
        followUps:
          $ref: "#/components/schemas/MessageChannelFollowUps"
          x-go-type-skip-optional-pointer: false
    MessageChannel:
      type: object
      required:
        [
          id,
          assistantId,
          name,
          enabled,
          source,
          filters,
          guide,
          sessionKey,
          scope,
          limits,
          createdAt,
          updatedAt,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
        assistantId:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        source:
          $ref: "#/components/schemas/MessageChannelSource"
        filters:
          $ref: "#/components/schemas/MessageChannelFilters"
        guide:
          type: string
        sessionKey:
          type: string
          enum: [conversation, thread]
          x-go-type: string
        scope:
          $ref: "#/components/schemas/MessageChannelScope"
        limits:
          $ref: "#/components/schemas/MessageChannelLimits"
        workspaceId:
          description:
            The workspace the channel's sessions run in, read-only for them; its AGENTS.md is the
            person's instructions for the channel. Empty on input creates one beside the assistant's home.
          type: string
        session:
          $ref: "#/components/schemas/MessageChannelSessionRule"
          x-go-type-skip-optional-pointer: false
        followUps:
          $ref: "#/components/schemas/MessageChannelFollowUps"
          x-go-type-skip-optional-pointer: false
        skillName:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    MessageChannelState:
      type: string
      enum:
        [
          starting,
          running,
          paused,
          waiting_device,
          needs_permission,
          unsupported,
          backing_off,
          held,
        ]
      x-go-type: string
    MessageChannelCounts:
      type: object
      required: [received, matched, delivered, held, dropped]
      additionalProperties: false
      properties:
        received:
          type: integer
        matched:
          type: integer
        delivered:
          type: integer
        held:
          type: integer
        dropped:
          type: integer
    MessageChannelStatus:
      type: object
      required: [state, counts]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/MessageChannelState"
        detail:
          type: string
        lastPollAt:
          type: string
        lastEventAt:
          type: string
        lastErrorAt:
          type: string
        gapAt:
          type: string
        counts:
          description: The last 24 hours.
          $ref: "#/components/schemas/MessageChannelCounts"
    MessageChannelPrerequisites:
      description: Whether the assistant may read the source and its home workspace has it bound.
      type: object
      required: [allowed, bound, level]
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        bound:
          type: boolean
        level:
          type: string
    MessageChannelView:
      type: object
      required: [channel, status, prerequisites, sessionIds]
      additionalProperties: false
      properties:
        channel:
          $ref: "#/components/schemas/MessageChannel"
        status:
          $ref: "#/components/schemas/MessageChannelStatus"
        prerequisites:
          $ref: "#/components/schemas/MessageChannelPrerequisites"
        workspace:
          $ref: "#/components/schemas/MessageChannelWorkspace"
          x-go-type-skip-optional-pointer: false
        sessionIds:
          description: The channel's sessions.
          type: array
          items:
            type: string
        conversationCount:
          description: The source conversations the channel has messages from, still within retention.
          type: integer
    MessageChannelWorkspace:
      description: Where the channel's sessions run, read-only for them.
      type: object
      required: [id, name, deviceId, path, skills]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        path:
          type: string
        skills:
          description: The skills bound to the workspace, which its sessions load.
          type: array
          items:
            type: string
    MessageChannelRolloverInput:
      description: The conversation (sessionKey of a delivery) whose next message starts a new session.
      type: object
      required: [sessionKey]
      additionalProperties: false
      properties:
        sessionKey:
          type: string
    MessageChannelList:
      type: object
      required: [channels, sources]
      additionalProperties: false
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelView"
        channelSessionIds:
          description:
            Every session the assistant's channels started, including those of deleted channels;
            they are not the person's conversation with the assistant.
          type: array
          items:
            type: string
        sources:
          description: Connector instances whose descriptor declares an event feed.
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelSource"
    MessageChannelDeliveryStatus:
      type: string
      enum: [dropped, held, queued, delivered, done, failed]
      x-go-type: string
    MessageChannelAction:
      description: Something the channel's session did after the message arrived.
      type: object
      required: [at, kind, summary]
      additionalProperties: false
      properties:
        at:
          type: string
        kind:
          type: string
          enum:
            [
              connector_write,
              connector_refused,
              needs_you,
              workspace_write_refused,
            ]
          x-go-type: string
        summary:
          type: string
    MessageChannelDelivery:
      type: object
      required: [id, channelId, envelope, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        channelId:
          type: string
        envelope:
          $ref: "#/components/schemas/MessageEnvelope"
        status:
          $ref: "#/components/schemas/MessageChannelDeliveryStatus"
        reason:
          description: For dropped, why; for queued, what it waits for.
          type: string
        rule:
          type: string
        sessionId:
          type: string
        sessionKey:
          description: The source conversation (and thread) the message belongs to.
          type: string
        segment:
          description: Which of the conversation's sessions, from 0.
          type: integer
        sessionNew:
          description: This message started the session.
          type: boolean
        newReason:
          description: "Why a new session started: first, idle, command, button, restarted."
          type: string
        createdAt:
          type: string
        deliveredAt:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelAction"
    MessageChannelDeliveryList:
      type: object
      required: [deliveries]
      additionalProperties: false
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelDelivery"
        nextCursor:
          description: Pass as cursor to read the next older page; absent when this is the last.
          type: string
    MessageChannelOrigin:
      description: >
        One turn's structured origin (DEV-234): the channel, the source conversation and thread,
        and each message of the batch. Stored with the session input, so the Web renders the turn
        without parsing the facts block the agent receives.
      type: object
      required: [channelId, channelName, source, conversation, messages, at]
      additionalProperties: false
      properties:
        channelId:
          type: string
        channelName:
          type: string
        source:
          description: The source's kind from its extension descriptor, e.g. openlark.
          type: string
        conversation:
          $ref: "#/components/schemas/MessageEnvelopeConversation"
        thread:
          $ref: "#/components/schemas/MessageEnvelopeThread"
        segment:
          description: Which of the conversation's sessions this turn belongs to, from 0.
          type: integer
        sessionNew:
          description: This turn started the session.
          type: boolean
        newReason:
          description: "Why a new session started: first, idle, command, button, restarted."
          type: string
        at:
          description: When the turn was handed over to the assistant.
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelOriginMessage"
    MessageChannelOriginMessage:
      description: One message of a turn, as the source sent it.
      type: object
      required: [id, sender, text]
      additionalProperties: false
      properties:
        id:
          type: string
        at:
          type: string
        sender:
          $ref: "#/components/schemas/MessageEnvelopeSender"
        text:
          type: string
        textTruncated:
          type: boolean
        status:
          $ref: "#/components/schemas/MessageChannelDeliveryStatus"
        rule:
          type: string
    MessageChannelOriginSummary:
      description: >
        The channel turn a session belongs to, for the session list (DEV-234): enough to mark the
        row and group its chat by source conversation.
      type: object
      required:
        [assistantId, channelId, channelName, source, sessionKey, conversation]
      additionalProperties: false
      properties:
        assistantId:
          type: string
        channelId:
          type: string
        channelName:
          type: string
        source:
          type: string
        sessionKey:
          type: string
        conversation:
          $ref: "#/components/schemas/MessageEnvelopeConversation"
        threadId:
          type: string
        threadIsReply:
          type: boolean
        segment:
          type: integer
        sessionNew:
          type: boolean
        newReason:
          type: string
        startedAt:
          type: string
        lastAt:
          type: string
        lastSender:
          $ref: "#/components/schemas/MessageEnvelopeSender"
    MessageChannelConversation:
      description: >
        One source conversation of a channel (DEV-234): its latest message and its sessions,
        newest first.
      type: object
      required:
        [
          sessionKey,
          conversation,
          lastAt,
          messageCount,
          matchedCount,
          sessionCount,
          sessions,
        ]
      additionalProperties: false
      properties:
        sessionKey:
          description: The conversation (and thread) key its messages carry.
          type: string
        conversation:
          $ref: "#/components/schemas/MessageEnvelopeConversation"
        lastSender:
          $ref: "#/components/schemas/MessageEnvelopeSender"
        lastAt:
          type: string
        messageCount:
          type: integer
        matchedCount:
          description: Messages a rule kept and the channel handed to the assistant.
          type: integer
        sessionCount:
          type: integer
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelConversationSession"
    MessageChannelConversationSession:
      description: "One segment of a source conversation: the assistant session it started."
      type: object
      required: [segment, lastAt, messageCount]
      additionalProperties: false
      properties:
        sessionId:
          type: string
        segment:
          type: integer
        new:
          description: The segment's first message started the session.
          type: boolean
        reason:
          description: "Why it started: first, idle, command, button, restarted."
          type: string
        status:
          type: string
        title:
          type: string
        startedAt:
          type: string
        lastAt:
          type: string
        messageCount:
          type: integer
    MessageChannelConversationList:
      type: object
      required: [conversations]
      additionalProperties: false
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelConversation"
        nextCursor:
          description: Pass as cursor to read the next older page; absent when this is the last.
          type: string
    SessionChannel:
      description: The message channel turns of one assistant session (DEV-234), oldest first.
      type: object
      required: [sessionId, turns]
      additionalProperties: false
      properties:
        sessionId:
          type: string
        turns:
          type: array
          items:
            $ref: "#/components/schemas/MessageChannelOrigin"
